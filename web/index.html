  <style>:root { --c-route:#2563eb; }  /* MTC's route tags stay blue */
    /* the bus in 3D on its card (live.js hero3D) */
    .lv-hero { position: relative; min-height: 150px; }
    /* "Hide buses not on a trip": filled grey with white text while it is in force, as Accessible only is blue */
    .lv-f.ng { border: 1px solid #e2ddd2; }
    .lv-f.ng.on, #lv-strip .lv-drop .lv-f.ng.on { background: #6f6b63; color: #fff; border-color: #6f6b63; }
    .lv-f.ng.on i { background: rgba(255,255,255,.3) !important; color: #fff; }
    .lv-f.ng.on .lv-n, .lv-f.ng.on span { color: #fff !important; }
    .lv-f.ng.on:hover { background: #5d5a53; }
    /* folded bus card: the next stop on its last line (live.js miniNext) */
    .lv-mnext { display: none; }
    #card.min.lv-hasnext .lv-mnext { display: flex; align-items: center; gap: 7px; margin-top: 5px; font-size: 13px; font-weight: 600; color: #1c1c1e; min-width: 0; }
    #card.min.lv-hasnext { max-height: 110px; }
    @media (min-width:700px){ #card.min.lv-hasnext { max-height: 102px; } }
    .lv-mnext > i { flex: none; width: 9px; height: 9px; border-radius: 50%; background: #9a958a; }
    .lv-mtrack { overflow: hidden; white-space: nowrap; min-width: 0; flex: 1; mask-image: linear-gradient(90deg, #000 92%, transparent); -webkit-mask-image: linear-gradient(90deg, #000 92%, transparent); }
    .lv-mtxt { display: inline-block; }
    .lv-mtxt.scroll { animation: lv-mscroll var(--dur, 8s) ease-in-out infinite; }
    @keyframes lv-mscroll { 0%, 18% { transform: translateX(0); } 70%, 88% { transform: translateX(var(--dx)); } 100% { transform: translateX(0); } }
    .lv-mnext.appr > i { background: #f0a000; animation: lv-blink 1.4s ease-in-out infinite; }
    .lv-mnext.appr .lv-mtrack b { animation: lv-blink 1.4s ease-in-out infinite; }
    .lv-mnext.near > i { background: #f01b48; animation: lv-blink .5s steps(2, jump-none) infinite; }
    .lv-mnext.near .lv-mtrack b { color: #d3123b; animation: lv-blink .5s steps(2, jump-none) infinite; }
    .lv-mnext.at > i { background: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,.2); }
    .lv-mnext.at .lv-mtrack b { color: #15803d; }
    @keyframes lv-blink { 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .lv-mnext .lv-mtrack b, .lv-mnext > i { animation: none !important; } .lv-mtxt.scroll { animation-duration: 20s; } }
    body.bm-dark #card.min.lv-hasnext .lv-mnext { color: #f2f2f2; }
    .lv-shade { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0 2px; padding: 8px 10px; border-radius: 10px; background: #fff6dc; color: #5a4300; font-size: 13px; line-height: 1.35; }
    .lv-shade svg { flex: none; margin-top: 1px; color: #e09a00; }
    .lv-shade.even { background: #f3f1ea; color: #555; }
    body.bm-dark .lv-shade { background: #3a3220; color: #f3e3b5; }
    body.bm-dark .lv-shade.even { background: #2c2c2e; color: #ccc; }
    .lv-mv { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .35s; background: transparent; --poster-color: transparent; --progress-bar-color: transparent; }
    .lv-mv.in { position: relative; opacity: 1; height: 180px; cursor: grab; }
    .lv-mv.in:active { cursor: grabbing; }
  </style>
